<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default `en` }}" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Theme CSS -->
    {{ $style := resources.Get "css/style.css" }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">

    <!-- Highlight.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-light.min.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header / Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-body sticky-top border-bottom">
            <div class="container-fluid px-4">
                <a class="navbar-brand d-flex align-items-center" href="{{ .Site.Home.Permalink }}">
                    <img id="logo" src="{{ `images/OutSystems-logo-digital-2018-main-color@3x.png` | relURL }}" alt="{{ .Site.Title }}" height="40" class="me-2">
                    <span class="site-title">Developer Workshops</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        {{ range .Site.Menus.main }}
                        <li class="nav-item">
                            <a class="nav-link {{ if $.IsMenuCurrent "main" . }}active{{ end }}" href="{{ .URL }}">{{ .Name }}</a>
                        </li>
                        {{ end }}
                        <li class="nav-item">
                            <button id="theme-toggle" class="btn btn-link nav-link" aria-label="Toggle dark mode" title="Toggle dark mode">
                                <span class="theme-icon">🌙</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <script>
            (function() {
                const toggle = document.getElementById('theme-toggle');
                const html = document.documentElement;
                const logo = document.getElementById('logo');

                function updateTheme() {
                    const isDark = html.getAttribute('data-theme') === 'dark';
                    toggle.textContent = isDark ? '☀️' : '🌙';

                    if (logo) {
                        if (isDark) {
                            logo.src = logo.src.replace('main-color', 'alternative-color');
                        } else {
                            logo.src = logo.src.replace('alternative-color', 'main-color');
                        }
                    }
                }

                function initTheme() {
                    const stored = localStorage.getItem('theme');
                    if (stored) {
                        html.setAttribute('data-theme', stored);
                    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        html.setAttribute('data-theme', 'dark');
                    }
                    updateTheme();
                }

                toggle.addEventListener('click', function() {
                    const current = html.getAttribute('data-theme') || 'light';
                    const next = current === 'dark' ? 'light' : 'dark';
                    html.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                    updateTheme();
                });

                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                    if (!localStorage.getItem('theme')) {
                        html.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                        updateTheme();
                    }
                });

                initTheme();
            })();
        </script>

        <!-- Main Content -->
        <main class="main-content">
            {{ block "main" . }}{{ end }}
        </main>

        <!-- Footer -->
        <footer class="site-footer py-4 border-top">
            <div class="container-fluid text-center text-muted small">
                <p class="mb-0">&copy; {{ now.Year }} OutSystems. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <script>
        (function() {
            // Initialize highlight.js
            document.addEventListener('DOMContentLoaded', function() {
                hljs.highlightAll();
            });

            // Watch for theme changes and update highlight.js theme
            const htmlElement = document.documentElement;
            const highlightLink = document.querySelector('link[href*="highlight.js"]');

            function updateHighlightTheme() {
                const isDark = htmlElement.getAttribute('data-theme') === 'dark';
                const newTheme = isDark ? 'atom-one-dark' : 'atom-one-light';
                const oldTheme = isDark ? 'atom-one-light' : 'atom-one-dark';

                if (highlightLink) {
                    const href = highlightLink.href;
                    highlightLink.href = href.replace(oldTheme, newTheme);
                }

                // Re-highlight with new theme
                setTimeout(() => {
                    document.querySelectorAll('pre code').forEach(block => {
                        hljs.highlightElement(block);
                    });
                }, 50);
            }

            // Watch for theme changes
            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                const originalClick = themeToggle.onclick;
                themeToggle.addEventListener('click', function() {
                    setTimeout(updateHighlightTheme, 100);
                });
            }

            // Watch for system theme changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
                setTimeout(updateHighlightTheme, 100);
            });

            // Initial highlight
            setTimeout(() => hljs.highlightAll(), 100);
        })();
    </script>
</body>
</html>
